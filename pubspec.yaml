name: dgfx
description: >-
  A 2D graphics engine in pure Dart: analytic anti-aliased rasterization,
  gradients, patterns, stroking, clipping and OpenType text. No dependencies.
version: 1.0.0
repository: https://github.com/insinfo/dgfx
issue_tracker: https://github.com/insinfo/dgfx/issues
documentation: https://github.com/insinfo/dgfx#readme

topics:
  - graphics
  - rasterizer
  - vector
  - canvas
  - opentype

environment:
  sdk: ^3.6.0

# The engine has no runtime dependencies: only `dart:core`, `dart:math`,
# `dart:typed_data` and `dart:async`. That is what keeps the package
# compilable for native, web and wasm without dragging anything along.

dev_dependencies:
  lints: ^5.0.0
  test: ^1.26.3
  # Used only by the benchmarks, to write PNGs for visual inspection.
  archive: ^4.0.7
